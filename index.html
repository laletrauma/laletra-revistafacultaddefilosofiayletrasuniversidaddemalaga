<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LA LETRA</title>
  <style>
    :root {
      --text: #000000;
      --accent: #000000;
      --border: rgba(0,0,0,.08);
      --shadow: rgba(0,0,0,.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: var(--text);
    }

    /* CABECERA */
    .navbar {
      background: #ffffff;
      border-bottom: 2px solid var(--accent);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      padding: 8px;
      color: #000000;
      font-family: 'Times New Roman', Times, serif;
      font-style: italic;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
      margin: 0;
      font-family: 'Times New Roman', Times, serif;
      font-style: italic;
    }

    .search-box {
      display: none;
    }

    .uma-logo {
      max-height: 60px;
      width: auto;
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header p {
      display: none;
    }

    /* GRID DE PORTADAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .navbar-content {
        flex-direction: column;
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(1, 1fr);
      }
    }

    /* TARJETA DE PORTADA */
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }

    .card.hidden {
      display: none;
    }

    .cover {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4.2;
      object-fit: cover;
      background: #f0f0f0;
    }

    .meta {
      display: none;
    }

    .meta small {
      display: none;
    }

    /* MENSAJE SIN RESULTADOS */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--text);
      font-size: 18px;
      display: none;
    }

    .no-results.show {
      display: block;
    }
  </style>
</head>
<body>

    <div class="navbar-content">
