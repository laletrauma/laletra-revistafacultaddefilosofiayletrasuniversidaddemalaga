<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Letra | Números</title>
    <style>
      :root {
        --bg: #f7f3ee;
        --card: #fff;
        --primary: #332b22;
        --accent: #8b5e3c;
        --soft: #e9dcc8;
        --text: #1f1a17;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .header h1 {
        margin: 0 0 8px;
        color: var(--primary);
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 800;
      }

      .header p {
        margin: 0;
        color: #4f453d;
        font-size: 1.05rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(35, 25, 20, 0.07);
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 28px rgba(35, 25, 20, 0.12);
      }

      .cover-link {
        display: block;
        text-decoration: none;
      }

      .cover {
        width: 100%;
        height: 300px;
        object-fit: cover;
        display: block;
        background: var(--soft);
      }

      .meta {
        padding: 14px 16px 16px;
      }

      .meta h2 {
        margin: 0 0 10px;
        font-size: 1.2rem;
        color: var(--primary);
        font-weight: 700;
      }

      .read {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.9rem;
        transition: background 0.2s ease;
      }

      .read:hover {
        background: var(--accent);
      }

      .empty {
        text-align: center;
        background: white;
        border-radius: 16px;
        padding: 32px;
        color: #544b45;
        border: 1px dashed rgba(0,0,0,0.15);
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #4f453d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>La Letra</h1>
        <p>Revista universitaria · Galería de números</p>
      </header>

      <main id="gallery" class="grid">
        <div class="loading">Cargando galería...</div>
      </main>
    </div>

    <script>
      async function loadIssues() {
        const gallery = document.getElementById('gallery');

        try {
          const response = await fetch('data/issues.json');
          const data = await response.json();

          gallery.innerHTML = '';

          if (!data.issues || data.issues.length === 0) {
            gallery.innerHTML = `
              <div class="empty" style="grid-column: 1 / -1;">
                Aún no hay números añadidos. Añade tus PDFs y portadas dentro de la carpeta <strong>ejemplares/</strong>.
              </div>
            `;
            return;
          }

          data.issues.forEach(issue => {
            const card = document.createElement('article');
            card.className = 'card';

            const cover = issue.cover || 'assets/placeholder-cover.svg';
            const pdf = issue.pdf || '#';

            card.innerHTML = `
              <a class="cover-link" href="${pdf}" target="_blank" rel="noopener noreferrer">
                <img class="cover" src="${cover}" alt="${issue.alt || 'Portada'}" loading="lazy" />
              </a>
              <div class="meta">
                <h2>${issue.numero}</h2>
                <a class="read" href="${pdf}" target="_blank" rel="noopener noreferrer">Leer PDF</a>
              </div>
            `;

            gallery.appendChild(card);
          });
        } catch (error) {
          gallery.innerHTML = `
            <div class="empty" style="grid-column: 1 / -1;">
              No se pudo cargar la lista de ejemplares. Error: ${error.message}
            </div>
          `;
        }
      }

      loadIssues();
    </script>
  </body>
</html>
