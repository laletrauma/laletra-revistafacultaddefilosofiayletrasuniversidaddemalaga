<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Letra | Revista Universitaria de Málaga</title>
  <meta name="description" content="La Letra es la revista universitaria de la Universidad de Málaga. Consulta los números completos de la publicación." />
  <meta property="og:title" content="La Letra | Revista Universitaria de Málaga" />
  <meta property="og:description" content="Consulta los números completos de La Letra." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --text: #000;
      --accent: #000;
      --border: rgba(0,0,0,.08);
      --shadow: rgba(0,0,0,.1);
      --bg: #fff;
      --fallback: #f0f0f0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .navbar {
      background: #fff;
      border-bottom: 2px solid var(--accent);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font: italic bold 14px/1.2 'Times New Roman', serif;
    }

    .logo {
      font: italic 900 32px 'Times New Roman', serif;
      letter-spacing: .12em;
      margin: 0;
    }

    .uma-logo {
      max-height: 70px;
      max-width: 260px;
      width: auto;
      object-fit: contain;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .issue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .issue-link {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      text-decoration: none;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      font-size: 1.05rem;
      line-height: 1.4;
    }

    .issue-link:hover {
      background: #fafafa;
      transform: translateX(3px);
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
    }

    .empty-state {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
      color: #555;
    }

    @media (max-width: 768px) {
      .navbar-content { flex-direction: column; }
      .logo { font-size: 24px; letter-spacing: .08em; }
      .issue-link { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-content">
      <div class="logo-section">
        <div class="logo-img">LA LETRA</div>
        <h1 class="logo">LA LETRA</h1>
      </div>
      <img src="https://www.uma.es/media/files/logo-uma-horizontal-positivo.png" alt="Logo de la Universidad de Málaga" class="uma-logo" onerror="this.remove()" />
    </div>
  </nav>

  <main class="container">
    <div id="gallery" class="issue-list"></div>
  </main>

  <script>
    async function loadGallery() {
      const gallery = document.getElementById('gallery');

      try {
        const response = await fetch('data/issues.json');
        if (!response.ok) throw new Error('No se pudo cargar data/issues.json');

        const data = await response.json();
        const issues = Array.isArray(data.issues) ? data.issues : [];

        if (!issues.length) {
          gallery.innerHTML = '<div class="empty-state">Todavía no hay ejemplares disponibles.</div>';
          return;
        }

        const orderedIssues = [...issues].sort((a, b) => {
          const na = Number((a.numero || '').replace(/\D+/g, '')) || 0;
          const nb = Number((b.numero || '').replace(/\D+/g, '')) || 0;
          return nb - na;
        });

        orderedIssues.forEach(issue => {
    const link = document.createElement('a');
    link.className = 'issue-link';
    
    // Primero calculamos el nombre limpio del archivo
    const fileName = issue.pdf ? issue.pdf.split('/').pop() : `${issue.numero}.pdf`;
    
    // SOLUCIÓN: Añadimos 'ejemplares/' antes del nombre del archivo
    link.href = issue.pdf ? 'ejemplares/' + fileName : '#';
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    
    link.textContent = `${issue.numero} — ${fileName}`;
    gallery.appendChild(link);
});
      } catch (err) {
        gallery.innerHTML = '<div class="empty-state">No se pudieron cargar los ejemplares. Revisa los enlaces de Drive o la carpeta de PDFs.</div>';
      }
    }

    loadGallery();
  </script>
</body>
</html>
